version: "3.9"

services:
  # ---- Postgres: source of truth for users, roles, permissions, audit logs ----
  postgres:
    image: postgres:16-alpine
    container_name: cerberus-postgres
    environment:
      POSTGRES_DB: cerberus
      POSTGRES_USER: cerberus
      POSTGRES_PASSWORD: cerberus_dev_password
    ports:
      - "5432:5432"          # host:container -- lets you connect from your own DB client too
    volumes:
      - pg_data:/var/lib/postgresql/data   # named volume = data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerberus"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Redis: refresh tokens, rate-limit counters, revoked-token blacklist ----
  redis:
    image: redis:7-alpine
    container_name: cerberus-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Mailhog: a fake SMTP server so you can test verification emails
  #      without spamming a real inbox. Open http://localhost:8025 to see
  #      every email your app "sends" land in a browser-based inbox. ----
  mailhog:
    image: mailhog/mailhog:latest
    container_name: cerberus-mailhog
    ports:
      - "1025:1025"   # SMTP port -- your app sends mail here
      - "8025:8025"   # web UI -- you view the mail here

  # ---- The app itself ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cerberus-app
    ports:
      - "8080:8080"
    environment:
      # Spring Boot's relaxed binding maps SPRING_DATASOURCE_URL -> the
      # spring.datasource.url property automatically, and env vars always
      # win over application.yml. So application.yml keeps its "localhost"
      # defaults (correct for running the jar directly on your machine),
      # while these overrides make the SAME config file correct here too --
      # no profile files, no duplicated config.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cerberus
      SPRING_DATASOURCE_USERNAME: cerberus
      SPRING_DATASOURCE_PASSWORD: cerberus_dev_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_MAIL_HOST: mailhog
      # Pass real Google credentials through from your shell environment,
      # if you've set them there -- falls back to the placeholder otherwise.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder-client-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped

volumes:
  pg_data:
